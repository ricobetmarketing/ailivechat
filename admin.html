<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    :root {
      --main-bg: #f4f7fc;
      --sidebar-bg: #ffffff;
      --content-bg: #ffffff;
      --primary-color: #007bff;
      --accent-color: #0056b3;
      --text-color: #333;
      --text-muted: #6c757d;
      --border-color: #e0e0e0;
      --table-header-bg: #f8f9fa;
      --form-input-border: #ccc;
      --danger-color: #dc3545;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--main-bg);
      color: var(--text-color);
      display: flex;
    }

    #sidebar {
      width: 250px;
      background-color: var(--sidebar-bg);
      box-shadow: 2px 0 5px rgba(0,0,0,0.05);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
    }
    .sidebar-header {
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 30px;
      color: var(--primary-color);
      padding: 0 10px;
    }
    .sidebar-menu ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .sidebar-menu li {
      padding: 15px 20px;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
      font-size: 1.05rem;
      border-left: 4px solid transparent;
    }
    .sidebar-menu li.active {
      background-color: #e7f0fc;
      color: var(--primary-color);
      border-left-color: var(--primary-color);
    }
    .sidebar-menu li:not(.active):hover {
      background-color: #f8f9fa;
    }

    #main-content {
      margin-left: 250px; /* Matches sidebar width */
      padding: 30px;
      width: calc(100% - 250px);
      overflow-y: auto;
      height: 100vh;
    }

    .section-title {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 25px;
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 10px;
    }

    /* Forms */
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .form-group input[type="text"],
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--form-input-border);
      border-radius: 5px;
      font-size: 1rem;
      font-family: inherit;
      margin-top: 5px;
    }
    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }
    .form-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s ease;
      font-weight: 500;
    }
    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--accent-color);
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #5a6268;
    }
    .btn-danger {
      background-color: var(--danger-color);
      color: white;
    }
    .btn-danger:hover {
      background-color: #c82333;
    }
    .btn-edit {
      background-color: #ffc107;
      color: #212529;
    }
    .btn-edit:hover {
      background-color: #e0a800;
    }

    /* Tables */
    .table-container {
      margin-top: 20px;
      overflow-x: auto; /* For responsiveness */
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background-color: var(--content-bg);
      border-radius: 8px;
      overflow: hidden; /* Ensures rounded corners */
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }
    th {
      background-color: var(--table-header-bg);
      font-weight: 600;
      color: var(--text-muted);
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover {
      background-color: #f8f9fa;
    }
    .table-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      margin-right: 5px;
      transition: color 0.2s ease;
    }
    .table-actions .btn-edit {
      color: #ffc107;
    }
    .table-actions .btn-danger {
      color: var(--danger-color);
    }
    .table-actions button:hover {
      opacity: 0.8;
    }
    .keywords-display {
        font-style: italic;
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    /* AI Settings */
    #ai-settings-section .form-group textarea {
        min-height: 200px;
    }
    #ai-settings-section .form-group label {
        font-size: 1.1rem;
        color: var(--primary-color);
    }

    /* Helper classes for view toggling */
    .hidden {
      display: none !important;
    }
  </style>
</head>
